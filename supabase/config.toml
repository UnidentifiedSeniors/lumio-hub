
[auth]
# Local Supabase mirrors the redirect allow-list used by production.
site_url = "https://lumiohub.app"
additional_redirect_urls = [
  "https://lumiohub.app",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

[functions.trade-notifier]
enabled = true
verify_jwt = false
import_map = "./functions/trade-notifier/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/trade-notifier/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/trade-notifier/*.html" ]

[functions.discord-rank-sync]
enabled = true
# Database Webhooks should use Supabase's "Add auth header with service key"
# option. The manual Settings action uses the member's JWT.
verify_jwt = true
import_map = "./functions/discord-rank-sync/deno.json"
entrypoint = "./functions/discord-rank-sync/index.ts"
